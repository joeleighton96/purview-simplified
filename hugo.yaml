baseURL: "https://purviewsimplified.com/"
languageCode: "en-gb"
title: "Purview Simplified"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Purview Simplified"
  description: "Plain-English writing on Microsoft Purview and M365 compliance."
  keywords: [Purview, Microsoft 365, Compliance, DLP, Information Protection]
  author: "Joe Leighton"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true

  # Site header: wordmark image only (hides the text title)
  label:
    text: ""
    icon: /emblem/ps-wordmark-mono-black.svg
    iconHeight: 36

  # Favicons and touch icons
  assets:
    favicon: /emblem/favicon-32.png
    favicon16x16: /emblem/favicon-32.png
    favicon32x32: /emblem/favicon-32.png
    apple_touch_icon: /emblem/apple-touch-icon-180.png
    safari_pinned_tab: /emblem/ps-emblem-mono-black.svg

  # Default Open Graph / social share image
  images:
    - /emblem/ps-lockup-og-1200x630.png

  homeInfoParams:
    Title: "Purview Simplified"
    Content: "Plain-English writing on Microsoft Purview and M365 compliance. Written by Joe Leighton."

  socialIcons:
    - name: github
      url: "https://github.com/joeleighton96"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON
